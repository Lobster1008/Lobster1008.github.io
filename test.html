  <meta charset="UTF-8" />

  <title>優惠彙整小站</title>
  <style>
    :root {
      --bg-a: #fff7fb;
      --bg-b: #f6fbff;
      --card: #ffffff;
      --accent: #ff5fa2;
      --accent-2: #38bdf8;
      --accent-3: #a78bfa;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(148, 163, 184, 0.4);
      --radius-lg: 22px;
      --radius-md: 14px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at 10% 10%, rgba(255, 95, 162, 0.18), transparent 45%),
        radial-gradient(circle at 90% 15%, rgba(56, 189, 248, 0.18), transparent 45%),
        radial-gradient(circle at 75% 90%, rgba(167, 139, 250, 0.2), transparent 45%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b) 55%, #ffffff);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 48px;
    }

    .app {
      max-width: 1080px;
      margin: 0 auto;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.88));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 24px 20px 28px;
      backdrop-filter: blur(16px);
    }

    @media (min-width: 768px) {
      .app {
        padding: 30px 34px 34px;
      }
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 2px;
      background: conic-gradient(from 140deg, var(--accent), var(--accent-3), var(--accent-2), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(255, 95, 162, 0.35);
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: radial-gradient(circle at 30% 0, #ffb4d6, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7c2d12;
      font-weight: 700;
      font-size: 15px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .chip-beta {
      font-size: 11px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #e0f2fe;
      background: radial-gradient(circle at top left, #0ea5e9, #020617);
      letter-spacing: 0.06em;
    }

    .subtitle {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, #111827, #020617);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: #e5e7eb;
      font-size: 11.5px;
      white-space: nowrap;
    }

    .stat-pill strong {
      color: #fbcfe8;
      font-weight: 700;
    }

    /* Toolbar */
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.7fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    @media (max-width: 720px) {
      .toolbar {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #020617;
      border-radius: 999px;
      padding: 9px 14px;
      border: 1px solid rgba(55, 65, 81, 0.9);
    }

    .search-icon {
      font-size: 13px;
      opacity: 0.8;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: #f8fafc;
      font-size: 13px;
    }

    .search-box input::placeholder {
      color: #94a3b8;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-tag {
      flex: 0 0 auto;
      border-radius: 999px;
      font-size: 11.5px;
      padding: 6px 12px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease-out;
    }

    .filter-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
    }

    .filter-tag.active {
      border-color: rgba(255, 95, 162, 0.6);
      background: radial-gradient(circle at 0 0, rgba(255, 95, 162, 0.2), #ffffff);
      box-shadow: 0 0 0 4px rgba(255, 95, 162, 0.14);
      transform: translateY(-1px);
      font-weight: 600;
    }

    .filter-tag:hover {
      border-color: rgba(255, 95, 162, 0.5);
      transform: translateY(-1px);
    }

    /* Results bar */
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .clear-filters {
      border: none;
      background: none;
      color: #0ea5e9;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      padding: 2px 4px;
    }

    .clear-filters[hidden] {
      display: none;
    }

    /* Grid */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .deal-card {
      display: flex;
      flex-direction: column;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92));
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.07);
      transition: transform 0.18s ease-out, box-shadow 0.18s ease-out, border-color 0.18s ease-out;
    }

    .deal-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 95, 162, 0.45);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-store {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .store-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(255, 95, 162, 0.16), rgba(56, 189, 248, 0.14));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .store-info {
      min-width: 0;
    }

    .store-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .deal-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-top: 1px;
    }

    .badge {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      color: #fff;
      white-space: nowrap;
    }

    .badge-hot {
      background: linear-gradient(135deg, #ff5fa2, #ff8fc0);
    }

    .badge-new {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    }

    .badge-urgent {
      background: linear-gradient(135deg, #f97316, #ef4444);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.35); }
      50% { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0); }
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .tag-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tag-chip .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
    }

    .card-desc {
      font-size: 12.5px;
      color: #334155;
      line-height: 1.6;
      margin: 10px 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .saving-chip {
      font-size: 12px;
      font-weight: 700;
      color: #9d174d;
      background: rgba(255, 95, 162, 0.12);
      border: 1px solid rgba(255, 95, 162, 0.28);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .expand-btn {
      margin-top: 12px;
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(248, 250, 252, 0.8);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease-out, border-color 0.15s ease-out;
    }

    .expand-btn:hover {
      border-color: rgba(255, 95, 162, 0.4);
      background: rgba(255, 95, 162, 0.06);
    }

    .expand-btn .chevron {
      transition: transform 0.2s ease-out;
    }

    .expand-btn.open .chevron {
      transform: rotate(180deg);
    }

    .details {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.25s ease;
    }

    .details.open {
      grid-template-rows: 1fr;
    }

    .details-inner {
      overflow: hidden;
      min-height: 0;
    }

    .details-content {
      padding-top: 12px;
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }

    .details.open .details-content {
      opacity: 1;
      transition-delay: 0.08s;
    }

    .detail-row strong {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
      font-weight: 600;
    }

    .detail-row span {
      display: block;
      font-size: 12.5px;
      color: #334155;
      line-height: 1.5;
    }

    .detail-link {
      align-self: flex-start;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      color: #075985;
      font-size: 11.5px;
      font-weight: 700;
      transition: transform 0.15s ease-out, border-color 0.15s ease-out;
    }

    .detail-link:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.6);
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    .empty-emoji {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 4px;
    }

    .empty-state span {
      font-size: 12px;
    }

    /* Footer */
    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>

        description: "攜帶任一廠牌舊手機至門市鑑定，換購指定新機再享會員加碼折抵。",
        period: "2026/07/01 ~ 2026/07/31",
        limit: "折抵金額依機況鑑定結果而定；需為會員本人辦理。",

    const searchInput = document.getElementById("searchInput");
    const dealsGrid = document.getElementById("dealsGrid");
    const resultsCount = document.getElementById("resultsCount");
    const clearFiltersBtn = document.getElementById("clearFilters");
    const typeFilters = document.getElementById("typeFilters");
    const totalCount = document.getElementById("totalCount");

    totalCount.textContent = deals.length;

    typeFilters.innerHTML = ["all", ...Object.keys(TAG_META)]
      .map((type) => {
        if (type === "all") {
          return `<button class="filter-tag active" data-type="all">全部</button>`;
        }
        const meta = TAG_META[type];
        return `<button class="filter-tag" data-type="${type}"><span class="dot" style="background:${meta.dot}"></span>${meta.label}</button>`;
      })
      .join("");

    let activeType = "all";

    function tagChip(type) {
      const m = TAG_META[type];
      if (!m) return "";
      return `<span class="tag-chip" style="background:${m.bg};border-color:${m.border};color:${m.color}"><span class="dot" style="background:${m.dot}"></span>${m.label}</span>`;
    }

    function matchesKeyword(deal, keyword) {
      if (!keyword) return true;
      const bundle = [deal.store, deal.title, deal.description, deal.limit, ...(deal.tags || [])]
        .join(" ")
        .toLowerCase();
      return bundle.includes(keyword);
    }

    function renderDeals() {
      const keyword = searchInput.value.trim().toLowerCase();
      const filtered = deals.filter((deal) => {
        if (activeType !== "all" && !deal.type.includes(activeType)) return false;
        return matchesKeyword(deal, keyword);
      });

      resultsCount.textContent = `共 ${filtered.length} 筆`;
      clearFiltersBtn.hidden = activeType === "all" && !keyword;

      if (!filtered.length) {
        dealsGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-emoji">🔍</div>
            <p>找不到符合條件的優惠</p>
            <span>試試移除篩選或換個關鍵字</span>
          </div>`;
        return;
      }

      dealsGrid.innerHTML = filtered
        .map(
          (deal) => `
        <article class="deal-card" data-id="${deal.id}">
          <div class="card-top">
            <div class="card-store">
              <span class="store-icon" aria-hidden="true">${deal.icon}</span>
              <div class="store-info">
                <div class="store-name">${deal.store}</div>
                <div class="deal-title">${deal.title}</div>
              </div>
            </div>
            ${deal.badge ? `<span class="badge badge-${deal.badgeType}">${deal.badge}</span>` : ""}
          </div>

          <div class="tag-row">${deal.type.map(tagChip).join("")}</div>

          <p class="card-desc">${deal.description}</p>

          <div class="card-meta">
            <span class="meta-item"><span aria-hidden="true">⏰</span>${deal.period}</span>
            <span class="saving-chip">${deal.savingShort}</span>
          </div>

          <button class="expand-btn" type="button" aria-expanded="false">
            <span>查看詳情</span><span class="chevron" aria-hidden="true">⌄</span>
          </button>

          <div class="details">
            <div class="details-inner">
              <div class="details-content">
                <div class="detail-row"><strong>估計可省</strong><span>${deal.saving}</span></div>
                <div class="detail-row"><strong>使用限制</strong><span>${deal.limit}</span></div>
                <a href="${deal.link}" target="_blank" rel="noreferrer" class="detail-link">
                  前往官方優惠頁 <span aria-hidden="true">↗</span>
                </a>
              </div>
            </div>
          </div>
        </article>`
        )
        .join("");
    }

    searchInput.addEventListener("input", () => renderDeals());

    typeFilters.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-tag");
      if (!btn) return;
      activeType = btn.dataset.type;
      [...typeFilters.querySelectorAll(".filter-tag")].forEach((el) =>
        el.classList.toggle("active", el === btn)
      );
      renderDeals();
    });

    clearFiltersBtn.addEventListener("click", () => {
      activeType = "all";
      searchInput.value = "";
      [...typeFilters.querySelectorAll(".filter-tag")].forEach((el) =>
        el.classList.toggle("active", el.dataset.type === "all")
      );
      renderDeals();
    });

    dealsGrid.addEventListener("click", (e) => {
      const btn = e.target.closest(".expand-btn");
      if (!btn) return;
      const details = btn.nextElementSibling;
      const isOpen = details.classList.toggle("open");
      btn.classList.toggle("open", isOpen);
      btn.setAttribute("aria-expanded", String(isOpen));
    });

    renderDeals();

    // 自訂埋點補充
    (function setupAnalyticsEvents() {
      if (!window.collectEvent) return;

      function eventParams(extra) {
        var params = {
          url: window.location.href,
          page_title: document.title,
        };
        if (!extra) return params;
        Object.keys(extra).forEach(function (key) {
          var val = extra[key];
          if (val !== undefined && val !== null && val !== "") {
            params[key] = val;
          }
        });
        return params;
      }

      // predefine_pageview、bav2b_click：SDK autotrack 自動上報

      window.addEventListener("beforeunload", function () {
        window.collectEvent("predefine_page_close", eventParams());
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          window.collectEvent("predefine_pageview_hide", eventParams());
        }
      });

      // $bav2b_exposure：優惠卡片曝光（系統預置曝光事件）
      const visibilityByDealId = new Map();
      let exposureObserver = null;
      const observeExposures = () => {
        const cards = document.querySelectorAll(".deal-card[data-id]");
        if (!cards.length) return;

        if (!("IntersectionObserver" in window)) return;

        if (exposureObserver) exposureObserver.disconnect();

        exposureObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const target = entry.target;
              const id = Number(target.dataset.id || 0);
              if (!id) return;

              const prevVisible = visibilityByDealId.get(id) === true;
              const nextVisible = entry.isIntersecting === true;
              if (prevVisible === nextVisible) return;
              visibilityByDealId.set(id, nextVisible);

              const deal = deals.find((d) => d.id === id);
              window.collectEvent("$bav2b_exposure", eventParams({
                exposure_type: "deal_card",
                exposure_state: nextVisible ? "enter" : "leave",
                deal_id: String(id),
                deal_store: deal ? deal.store : "",
                deal_title: deal ? deal.title : "",
                deal_link: deal ? deal.link : "",
              }));
            });
          },
          { root: null, threshold: 0.6 }
        );

        cards.forEach((c) => exposureObserver.observe(c));
      };

      observeExposures();
      const _renderDeals = renderDeals;
      renderDeals = function () {
        _renderDeals();
        observeExposures();
      };
    })();
  </script>
